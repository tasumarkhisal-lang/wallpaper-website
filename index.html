<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Hub - Ultra HD Wallpapers</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <!-- Left Sidebar -->
<aside class="sidebar">
    <div class="sidebar-top">
        <a href="#" class="nav-icon active" id="navHome" onclick="showHomeView(event)" title="Home"><i class="fa-solid fa-wand-magic-sparkles"></i></a>
        <a href="#" class="nav-icon" id="navGallery" onclick="showGalleryView(event)" title="Gallery"><i class="fa-regular fa-image"></i></a>
        <a href="#" class="nav-icon" id="navVideos" onclick="showVideosView(event)" title="Videos"><i class="fa-regular fa-circle-play"></i></a>
        <a href="#" class="nav-icon" id="navExplore" onclick="showExploreView(event)" title="Explore"><i class="fa-regular fa-compass"></i></a>
        <a href="#" class="nav-icon" id="navDownloads" onclick="showDownloadsView(event)" title="Downloads"><i class="fa-solid fa-download"></i></a>
        <a href="#" class="nav-icon" id="navBookmarks" onclick="showBookmarksView(event)" title="Bookmarks"><i class="fa-regular fa-bookmark"></i></a>
    </div>
    <div class="sidebar-bottom">
        <a href="login.html" class="nav-icon" id="navAccount" title="Account"><i class="fa-regular fa-user"></i></a>
        <a href="#" class="nav-icon" id="navLanguage" onclick="toggleLanguage(event)" title="Language"><i class="fa-solid fa-language"></i></a>
        <a href="#" class="nav-icon" id="navMenu" onclick="toggleSidebarMenu(event)" title="Menu"><i class="fa-solid fa-bars"></i></a>
    </div>
</aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        
        <!-- Header Navigation -->
        <header class="navbar">
            <div class="logo">
                <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
                <span class="logo-text">WallpaperHub</span>
            </div>
            <div class="nav-actions">
                <button class="nav-btn fav-badge-btn" onclick="showFavorites()" id="favCountBtn" title="Favorites">
                    <i class="fa-solid fa-heart"></i> <span id="favCounter">(0)</span>
                </button>
                <button class="nav-btn" id="themeToggleBtn" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="login.html" class="login-btn-nav" title="Login / Profile">
                    <i class="fa-solid fa-user"></i>
                </a>
            </div>
        </header>

        <!-- Main Hero Section -->
        <section class="hero-section">
            <h1 class="hero-title">JennWall 4K Wallpaper</h1>
            <p class="hero-subtitle">Download ultra HD 4K wallpapers for your desktop & phone</p>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search here..." autocomplete="off">
                <button id="searchBtn">Search</button>
                <div id="recentSearches" class="recent-searches"></div>
            </div>

            <!-- Category Pills -->
            <div class="categories">
                <button class="chip active" onclick="filterCategory('4k wallpaper')">All</button>
                <button class="chip" onclick="filterCategory('Nature')">Nature</button>
                <button class="chip" onclick="filterCategory('Anime')">Anime</button>
                <button class="chip" onclick="filterCategory('Cars')">Cars</button>
                <button class="chip" onclick="filterCategory('Aesthetic')">Aesthetic</button>
                <button class="chip" onclick="filterCategory('Dark')">Dark</button>
            </div>

            <!-- Filters Bar -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="orientationFilter"><i class="fa-solid fa-crop-simple"></i> Orientation:</label>
                    <select id="orientationFilter" onchange="applyFilters()">
                        <option value="">All Types</option>
                        <option value="landscape">Landscape</option>
                        <option value="portrait">Portrait</option>
                        <option value="square">Square</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="colorFilter"><i class="fa-solid fa-palette"></i> Color:</label>
                    <select id="colorFilter" onchange="applyFilters()">
                        <option value="">All Colors</option>
                        <option value="black_and_white">Black & White</option>
                        <option value="blue">Blue</option>
                        <option value="red">Red</option>
                        <option value="green">Green</option>
                        <option value="yellow">Yellow</option>
                        <option value="purple">Purple</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="sortFilter"><i class="fa-solid fa-arrow-down-wide-short"></i> Sort By:</label>
                    <select id="sortFilter" onchange="applyFilters()">
                        <option value="relevant">Relevant</option>
                        <option value="latest">Latest</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Gallery Grid -->
        <main class="gallery-container">
            <div id="wallpaperGallery" class="gallery"></div>
            
            <div id="loading" class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading wallpapers...</p>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Wallpaper Detail Modal -->
    <div id="wallpaperDetailModal" class="modal">
        <div class="wallpaper-modal-content">
            <span class="close-modal" onclick="closeWallpaperDetail()">&times;</span>
            <div class="modal-image-wrapper">
                <img id="detailMainImage" src="" alt="Wallpaper Detail">
            </div>
            <div class="modal-actions">
                <button id="detailDownloadBtn" class="btn btn-primary"><i class="fa-solid fa-download"></i> Download Original</button>
                <button id="detailFavBtn" class="btn btn-secondary"><i class="fa-regular fa-heart"></i> Favorite</button>
                <button id="detailShareBtn" class="btn btn-secondary"><i class="fa-solid fa-share-nodes"></i> Share</button>
            </div>
            <div class="related-section">
                <h3>Related Wallpapers</h3>
                <div id="relatedGrid" class="related-grid"></div>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="modal">
        <div class="modal-card">
            <span class="close-modal" onclick="closeShareModal()">&times;</span>
            <h3>Share Wallpaper</h3>
            <p style="font-size: 0.9rem; margin-bottom: 12px; color: var(--text-muted);">Copy the link or share directly to social media:</p>
            <div class="share-input-group">
                <input type="text" id="shareLinkInput" readonly>
                <button onclick="copyShareLink()">Copy</button>
            </div>
            <div class="social-share-btns">
                <button onclick="shareToSocial('whatsapp')" class="social-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
                <button onclick="shareToSocial('facebook')" class="social-btn facebook"><i class="fa-brands fa-facebook"></i> Facebook</button>
                <button onclick="shareToSocial('twitter')" class="social-btn twitter"><i class="fa-brands fa-x-twitter"></i> X / Twitter</button>
                <button onclick="shareToSocial('pinterest')" class="social-btn pinterest"><i class="fa-brands fa-pinterest"></i> Pinterest</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
